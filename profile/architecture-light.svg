<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Architecture: browser to React interface to Laravel API to MySQL, with the matching engine behind an identity firewall.">
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c7f85"/></marker></defs>
  <rect width="1280" height="440" rx="20" fill="#f6f7f9"/>
  <rect width="1280" height="440" rx="20" fill="none" stroke="#dcdee2"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="2" fill="#005422">THREE ISOLATED TIERS, ONE PRIVATE ENGINE</text>
    <rect x="40" y="70" width="220" height="96" rx="14" fill="#ffffff" stroke="#dcdee2" stroke-width="1.5"/><text x="150.0" y="114.0" text-anchor="middle" font-size="19" font-weight="700" fill="#13161e">Browser</text><text x="150.0" y="138.0" text-anchor="middle" font-size="14" fill="#61646b">candidate · recruiter · admin</text><rect x="340" y="70" width="240" height="96" rx="14" fill="#ffffff" stroke="#dcdee2" stroke-width="1.5"/><text x="460.0" y="114.0" text-anchor="middle" font-size="19" font-weight="700" fill="#13161e">React interface</text><text x="460.0" y="138.0" text-anchor="middle" font-size="14" fill="#61646b">no database access</text><rect x="660" y="70" width="240" height="96" rx="14" fill="#ffffff" stroke="#dcdee2" stroke-width="1.5"/><text x="780.0" y="114.0" text-anchor="middle" font-size="19" font-weight="700" fill="#13161e">Laravel API</text><text x="780.0" y="138.0" text-anchor="middle" font-size="14" fill="#61646b">auth · permissions · audit</text><rect x="980" y="70" width="260" height="96" rx="14" fill="#ffffff" stroke="#dcdee2" stroke-width="1.5"/><text x="1110.0" y="114.0" text-anchor="middle" font-size="19" font-weight="700" fill="#13161e">MySQL</text><text x="1110.0" y="138.0" text-anchor="middle" font-size="14" fill="#61646b">personal data sealed per person</text><rect x="660" y="290" width="240" height="96" rx="14" fill="#ffffff" stroke="#007432" stroke-width="2"/><text x="780.0" y="334.0" text-anchor="middle" font-size="19" font-weight="700" fill="#13161e">Matching engine</text><text x="780.0" y="358.0" text-anchor="middle" font-size="14" fill="#61646b">Python · FastAPI</text><line x1="262" y1="118" x2="336" y2="118" stroke="#7c7f85" stroke-width="2" marker-end="url(#head)"/><line x1="582" y1="118" x2="656" y2="118" stroke="#7c7f85" stroke-width="2" marker-end="url(#head)"/><line x1="902" y1="118" x2="976" y2="118" stroke="#7c7f85" stroke-width="2" marker-end="url(#head)"/><line x1="780" y1="168" x2="780" y2="286" stroke="#7c7f85" stroke-width="2" marker-end="url(#head)"/><rect x="600" y="232" width="360" height="178" rx="18" fill="none" stroke="#007432" stroke-width="1.5" stroke-dasharray="7 6"/><rect x="618" y="220" width="210" height="26" rx="13" fill="#def0e6"/><text x="723" y="238" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#005422">IDENTITY FIREWALL</text><text x="990" y="318" font-size="15" font-weight="600" fill="#13161e">Internal only</text><text x="990" y="342" font-size="14" fill="#61646b">No database credentials.</text><text x="990" y="364" font-size="14" fill="#61646b">Receives de-identified skills only.</text><text x="796" y="214" font-size="13" fill="#61646b">skills, never names</text>
  </g>
</svg>
